<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elanur Öğüç - Ülke Bilgisi</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            font-family: Arial, sans-serif;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 15px;
            margin-top: 15px;
            display: none; /* Başlangıçta gizli */
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            background: #0072ff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #005bd1;
        }

        .info {
            margin-top: 20px;
            text-align: left;
            color: #333;
            line-height: 1.6;
        }

        .info p {
            margin: 8px 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌎 Ülke Bilgisi</h2>
        
        <select id="countrySelect">
            <option value="">Bir ülke seçiniz...</option>
        </select>

        <button onclick="getCountry()">Bilgileri Göster</button>

        <img id="flag" src="" alt="Ülke Bayrağı" />

        <div class="info" id="info"></div>
    </div>

    <script>
        let countries = [];

        // API'den verileri çek ve alfabetik sırala
        fetch("https://restcountries.com/v3.1/all")
            .then(response => response.json())
            .then(data => {
                // Ülkeleri isimlerine göre (A-Z) sıralıyoruz
                countries = data.sort((a, b) => a.name.common.localeCompare(b.name.common));

                const select = document.getElementById("countrySelect");
                countries.forEach(country => {
                    const option = document.createElement("option");
                    option.value = country.name.common;
                    option.innerText = country.name.common;
                    select.appendChild(option);
                });
            })
            .catch(err => console.error("Veri çekilirken hata oluştu:", err));

        function getCountry() {
            const selectedName = document.getElementById("countrySelect").value;
            const infoDiv = document.getElementById("info");
            const flagImg = document.getElementById("flag");

            if (!selectedName) {
                alert("Lütfen bir ülke seçin!");
                return;
            }

            // Seçilen ülkeyi listede bul
            const country = countries.find(c => c.name.common === selectedName);

            if (country) {
                // Bayrağı göster
                flagImg.src = country.flags.png;
                flagImg.style.display = "block";

                // Para birimi bilgisini güvenli bir şekilde al
                let currencyInfo = "-";
                if (country.currencies) {
                    const currencyKey = Object.keys(country.currencies)[0];
                    const currency = country.currencies[currencyKey];
                    currencyInfo = `${currency.name} (${currency.symbol || ''})`;
                }

                // Bilgileri ekrana yazdır
                infoDiv.innerHTML = `
                    <p><strong>Başkent:</strong> ${country.capital ? country.capital[0] : "-"}</p>
                    <p><strong>Bölge:</strong> ${country.region}</p>
                    <p><strong>Nüfus:</strong> ${country.population.toLocaleString('tr-TR')}</p>
                    <p><strong>Para Birimi:</strong> ${currencyInfo}</p>
                `;
            }
        }
    </script>
</body>
</html>
