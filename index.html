<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Elanur Ögüç</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }
        img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 15px;
            margin-top: 15px;
        }
        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            background: #0072ff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #005bd1;
        }
        .info {
            margin-top: 15px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🌍 Ülke Bilgisi</h2>
    <select id="countrySelect" onchange="handleCountrySelection()"></select>

    <div class="button-group">
        <button onclick="handleCountrySelection()">Bilgileri Göster</button>
    </div>

    <img id="flag" />
    <div class="info" id="info"></div>
</div>

<script>
    // 1. STATE
    const state = {
        countries: [],
        selectedCountry: null,
        error: null
    };

    // 2. RENDER: State her değiştiğinde bu fonksiyon çalışır
    function render() {
        const select = document.getElementById("countrySelect");
        const infoDiv = document.getElementById("info");
        const flagImg = document.getElementById("flag");

        if (state.error) {
            infoDiv.innerHTML = `<p style="color:red">${state.error}</p>`;
            return;
        }

        // Dropdown doldurma
        if (select.options.length === 0 && state.countries.length > 0) {
            state.countries.forEach(country => {
                const option = document.createElement("option");
                option.value = country.name.common;
                option.textContent = country.name.common;
                select.appendChild(option);
            });
            state.selectedCountry = state.countries[0];
        }

        // Seçili Ülke Bilgisi
        const country = state.selectedCountry;
        if (country) {
            flagImg.src = country.flags.png;
            infoDiv.innerHTML = `
                <p><strong>Başkent:</strong> ${country.capital?.[0] || "-"}</p>
                <p><strong>Nüfus:</strong> ${country.population?.toLocaleString()}</p>
            `;
        }
    }

    // 3. ACTIONS
    function handleCountrySelection() {
        const val = document.getElementById("countrySelect").value;
        state.selectedCountry = state.countries.find(c => c.name.common === val);
        render();
    }

    async function init() {
        try {
            const res = await fetch("https://restcountries.com/v3.1/region/europe");
            if (!res.ok) throw new Error("API hatası");
            state.countries = await res.json();
            render();
        } catch (err) {
            state.error = "Veriler yüklenemedi.";
            render();
        }
    }

    init();
</script>

</body>
</html>
